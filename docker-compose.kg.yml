# Local Neo4j for Modephere's knowledge graph (src/modephere/kg).
#
#   docker compose -f docker-compose.kg.yml up -d
#   uv run python -m modephere.chembl extract
#   uv run python -m modephere.kg load-chembl
#
# Browser: http://localhost:7475  (bolt://localhost:7688)
# Ports and volume differ from dev_Pgen's pharmagen-neo4j, so both can run.
# Memory is sized for a 15 GB WSL2 machine; the ChEMBL drug layer is ~0.1 GB.
services:
  neo4j:
    image: neo4j:2026.09
    container_name: modephere-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${MODEPHERE_KG__PASSWORD:-modephere-dev}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - modephere-neo4j-data:/data

volumes:
  modephere-neo4j-data:
